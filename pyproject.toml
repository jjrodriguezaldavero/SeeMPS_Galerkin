[project]
name = "seemps_galerkin"
version = "1.0.0"
description = "Tensor-network Chebyshev-Galerkin methods for elliptic boundary-value problems"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [
  { name = "Juan José Rodríguez Aldavero" },
  { name = "Ángel de la Rosa Velasco" },
  { name = "Juan José García Ripoll" }
]

dependencies = [
  "numpy>=2",
  "opt_einsum",
  "scipy",
  "seemps==3.0.0",
  "threadpoolctl",
]

[dependency-groups]
experiments = [
  "matplotlib>=3.10",
  "ipykernel>=7.1",
  "jupyter>=1.1",
  "nbconvert>=7.17",
]
test = [
  "pytest>=8.0",
]

[tool.uv]
default-groups = ["experiments", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seemps_galerkin"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["I", "E741", "E731"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
